services:
  loviistory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-loviistory}
    ports:
      - "5433:5432"
    volumes:
      - loviistory_pgdata_v2:/var/lib/postgresql/data
    restart: unless-stopped

  loviistory-minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - loviistory_minio_data_v2:/data
    restart: unless-stopped

  loviistory-createbuckets:
    image: minio/mc
    depends_on:
      - loviistory-minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;

      until /usr/bin/mc alias set myminio http://loviistory-minio:${MINIO_PORT:-9000} ${MINIO_ACCESS_KEY:-admin} ${MINIO_SECRET_KEY:-password123}; do
        echo 'Aguardando MinIO iniciar...';
        sleep 3;
      done;

      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-loviistory};
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_NAME:-loviistory};

      echo 'Bucket configurado com sucesso';
      exit 0;
      "
    restart: "no"

  loviistory:
    image: sunshinedn/loviistory:latest
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sunverse}:${POSTGRES_PASSWORD:-password}@loviistory-db:5432/${POSTGRES_DB:-loviistory}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-loviistory-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-loviistory}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      - loviistory-db
      - loviistory-minio
    restart: unless-stopped

volumes:
  loviistory_pgdata_v2:
  loviistory_minio_data_v2: